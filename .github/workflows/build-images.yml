name: Build connector images

# Builds the connectors listed in images.json from their branches on the
# connectors fork and pushes them to ghcr.io/<owner>/connector-<name>.
#
# Tags per image: the branch name, pr-<number> when the entry has an upstream
# pull request, and sha-<commit>-pycti-<version> for the exact build. See README.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build only this image name from images.json (empty: all)"
        required: false
        default: ""
      pycti_version:
        description: "Pin pycti to this version, to match the OpenCTI platform (empty: the connectors-sdk master pin)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [images.json, .github/workflows/build-images.yml]

env:
  SOURCE_REPOSITORY: FIying-Scotsman/connectors
  UPSTREAM_REPOSITORY: OpenCTI-Platform/connectors

permissions:
  contents: read

jobs:
  matrix:
    name: Select images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Images whose upstream pull request is merged are not built any more: the
      # official image takes over, and the cleanup workflow deletes them later. The
      # entry stays in images.json; a new pr number builds it again.
      - name: Select images
        id: select
        env:
          ONLY: ${{ inputs.only }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          selected=$(jq -c --arg only "$ONLY" '[.[] | select($only == "" or .name == $only)]' images.json)
          if [ "$selected" = "[]" ]; then
            echo "::error::No image named '$ONLY' in images.json"
            exit 1
          fi
          images="[]"
          while read -r entry; do
            name=$(jq -r .name <<< "$entry")
            pr=$(jq -r '.pr // empty' <<< "$entry")
            if [ -n "$pr" ]; then
              merged=$(gh api "repos/${UPSTREAM_REPOSITORY}/pulls/${pr}" --jq '.merged_at // empty')
              if [ -n "$merged" ]; then
                echo "::notice::${name}: PR #${pr} merged on ${merged%T*}, not built. Set its pr to a new pull request to build it again."
                continue
              fi
            fi
            images=$(jq -c --argjson entry "$entry" '. + [$entry]' <<< "$images")
          done < <(jq -c '.[]' <<< "$selected")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: matrix
    if: needs.matrix.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - name: Check out ${{ matrix.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ matrix.branch }}
          sparse-checkout: ${{ matrix.path }}

      # The branches install connectors-sdk from upstream master, which pins an exact
      # pycti version: an older pin on the branch cannot be installed alongside it.
      # A manual pycti version also pins connectors-sdk to the upstream release tag of
      # that version, whose own pycti pin is the same.
      - name: Pin pycti
        id: pycti
        working-directory: ${{ matrix.path }}
        env:
          PYCTI_VERSION: ${{ inputs.pycti_version }}
        run: |
          if [ -n "$PYCTI_VERSION" ]; then
            if ! git ls-remote --exit-code --tags https://github.com/OpenCTI-Platform/connectors.git "refs/tags/${PYCTI_VERSION}" > /dev/null; then
              echo "::error::No upstream release tag ${PYCTI_VERSION}: use an OpenCTI release version"
              exit 1
            fi
            sdk="connectors-sdk @ git+https://github.com/OpenCTI-Platform/connectors.git@${PYCTI_VERSION}#subdirectory=connectors-sdk"
            find . \( -name pyproject.toml -o -name requirements.txt \) \
              -exec sed -i -E "s|connectors-sdk @ git\+https://github\.com/OpenCTI-Platform/connectors\.git@[^#]+#subdirectory=connectors-sdk|${sdk}|" {} +
            echo "manual=true" >> "$GITHUB_OUTPUT"
          else
            PYCTI_VERSION=$(curl -fsSL https://raw.githubusercontent.com/OpenCTI-Platform/connectors/master/connectors-sdk/pyproject.toml \
              | sed -nE 's/.*"pycti==([0-9.]+)".*/\1/p' | head -1)
            if [ -z "$PYCTI_VERSION" ]; then
              echo "::error::No pycti pin found in connectors-sdk master"
              exit 1
            fi
            echo "pycti pin of connectors-sdk master: ${PYCTI_VERSION}"
            echo "manual=false" >> "$GITHUB_OUTPUT"
          fi
          find . \( -name pyproject.toml -o -name requirements.txt \) \
            -exec sed -i -E "s/pycti==[0-9][0-9.]*/pycti==${PYCTI_VERSION}/" {} +
          grep -rnE "pycti==|connectors-sdk @" --include=pyproject.toml --include=requirements.txt .
          echo "version=${PYCTI_VERSION}" >> "$GITHUB_OUTPUT"

      # Default builds move the branch and pr- tags. A manual pycti build only gets
      # tags with the version in them, so the default tags never change underneath
      # a deployment.
      - name: Compute tags
        id: tags
        env:
          NAME: ${{ matrix.name }}
          BRANCH: ${{ matrix.branch }}
          PR: ${{ matrix.pr }}
          OWNER: ${{ github.repository_owner }}
          PYCTI: ${{ steps.pycti.outputs.version }}
          MANUAL: ${{ steps.pycti.outputs.manual }}
        run: |
          image="ghcr.io/${OWNER,,}/connector-${NAME}"
          branch_tag=$(printf '%s' "${BRANCH,,}" | tr -c 'a-z0-9._-' '-')
          names=("$branch_tag")
          if [ -n "$PR" ]; then
            names+=("pr-${PR}")
          fi
          tags="${image}:sha-$(git rev-parse --short=7 HEAD)-pycti-${PYCTI}"
          for tag_name in "${names[@]}"; do
            if [ "$MANUAL" = "true" ]; then
              tags="${tags},${image}:${tag_name}-pycti-${PYCTI}"
            else
              tags="${tags},${image}:${tag_name}"
            fi
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Tags: $tags"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: ${{ matrix.path }}
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          REVISION: ${{ steps.tags.outputs.revision }}
          BRANCH: ${{ matrix.branch }}
        run: |
          tag_args=()
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx build . \
            --platform linux/amd64 \
            --provenance=false \
            "${tag_args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.url=https://github.com/${SOURCE_REPOSITORY}/tree/${BRANCH}/${{ matrix.path }}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.description=OpenCTI ${{ matrix.name }} connector, unmerged branch ${BRANCH}" \
            --push
